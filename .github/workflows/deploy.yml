name: Build & Deploy rankings

# いつ実行するか
on:
  push:
    branches: [main]          # データCSVやevents.jsonを更新してpushしたら自動で再生成・公開
  workflow_dispatch:          # GitHubの画面から手動実行も可能
  # schedule:
  #   - cron: '0 0 * * *'     # ← 有効化すると毎日09:00 JSTに再生成（元データが同じでも「最終更新」時刻は更新される）

# GitHub Pages へデプロイするための権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1本に絞る（多重デプロイ防止）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を用意
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        # build.py は標準ライブラリのみ。pip install は不要。

      - name: ランキングページを生成 (docs/ を再生成)
        run: python build.py

      - name: Pages 用アーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: GitHub Pages へデプロイ
        id: deploy
        uses: actions/deploy-pages@v4
