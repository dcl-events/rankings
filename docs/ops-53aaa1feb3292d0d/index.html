<script>
(async () => {
  const m = document.getElementById("m");
  const k = location.hash.slice(1);
  if (!k) { m.textContent = "このページを見るには、鍵の付いたURL（# から後ろまで含む）で開いてください。"; return; }
  try {
    const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const raw = b(k.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - k.length % 4) % 4));
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const e = JSON.parse(document.getElementById("enc").textContent);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(e.iv) }, key, b(e.ct));
    const html = new TextDecoder().decode(pt);
    // 読み込み画面を丸ごと差し替え（document.write は環境によって追記になるので使わない）
    const doc = new DOMParser().parseFromString('<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"></head><body>' + html + '</body></html>', "text/html");
    const scripts = [...doc.querySelectorAll("script")].map(sc => { const t = sc.textContent; sc.remove(); return t; });
    document.head.replaceWith(document.adoptNode(doc.head));
    document.body.replaceWith(document.adoptNode(doc.body));
    document.title = doc.title || document.title;
    for (const t of scripts) { const n = document.createElement("script"); n.textContent = t; document.body.appendChild(n); }
  } catch (err) { m.textContent = "鍵が違うか、URLが途中で切れています。共有されたURLを # から後ろまでそのまま開いてください。"; }
})();
</script></body></html>
