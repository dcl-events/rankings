<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>TikTok LIVE 日次ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 上に月の着地メーター → シグナル6枚（クリックで絞り込み）→ シグナル別リスト → 初配信の進捗 → 全員表 */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --ink:#14201f; --muted:#5d6b6a; --line:#dde3e3;
  --accent:#0d7c74; --accent-soft:#d6efec; --plan:#8a6a1f;
  --up:#1b7f3b; --up-soft:#dcf1e2; --warn:#b4560b; --warn-soft:#fbe9d8; --down:#b3261e; --down-soft:#f8dcd9;
  --info:#3b55b8; --info-soft:#e0e6fb;
  --f-display:"Chakra Petch","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1515; --panel:#172020; --ink:#e4ecea; --muted:#93a3a1; --line:#2a3635;
  --accent:#3cc2b5; --accent-soft:#163c39; --plan:#d6b25a;
  --up:#5fd283; --up-soft:#17331f; --warn:#f0a35a; --warn-soft:#3a2817; --down:#f28b82; --down-soft:#3d1c1a;
  --info:#93a8f5; --info-soft:#1e2647; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1515; --panel:#172020; --ink:#e4ecea; --muted:#93a3a1; --line:#2a3635;
  --accent:#3cc2b5; --accent-soft:#163c39; --plan:#d6b25a;
  --up:#5fd283; --up-soft:#17331f; --warn:#f0a35a; --warn-soft:#3a2817; --down:#f28b82; --down-soft:#3d1c1a;
  --info:#93a8f5; --info-soft:#1e2647; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:20px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:1.35rem;letter-spacing:.02em}
h2{font-size:1.02rem;letter-spacing:.03em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
/* meter */
.meter-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;font-family:var(--f-num)}
.meter-line .big{font-size:1.9rem;font-weight:600}
.meter-line .lab{font-family:var(--f-body);font-size:.75rem;color:var(--muted);letter-spacing:.06em;display:block}
.meter-line .arrow{color:var(--muted);font-size:1.2rem}
.bar{position:relative;height:14px;background:var(--line);border-radius:7px;margin-top:14px;overflow:visible}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:7px}
.bar .proj{position:absolute;inset:0 auto 0 0;background:var(--accent-soft);border-radius:7px}
.bar .tick{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--plan)}
.bar-legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.78rem;color:var(--muted);margin-top:10px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--up-soft);color:var(--up)} .pill.ng{background:var(--down-soft);color:var(--down)}
svg text{fill:var(--muted);font-family:var(--f-num);font-size:10px}
/* signals */
.signals{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:980px){.signals{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.signals{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sig{all:unset;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:2px;border-top:4px solid var(--c)}
.sig:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sig[aria-pressed="true"]{background:var(--cs)}
.sig .n{font-family:var(--f-display);font-size:1.7rem;font-weight:700;color:var(--c);line-height:1.1}
.sig .t{font-weight:700;font-size:.85rem}
.sig .d{font-size:.72rem;color:var(--muted)}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.list h2{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.list h2 .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 84px;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.row .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:.72rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{text-align:right;font-family:var(--f-num);font-size:.85rem}
.row .val small{display:block;color:var(--muted);font-size:.7rem}
.more{all:unset;cursor:pointer;color:var(--accent);font-size:.8rem;margin-top:6px;display:inline-block}
.empty{color:var(--muted);font-size:.85rem;padding:8px 0}
/* table */
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.controls input,.controls select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.controls input{flex:1 1 200px;min-width:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:.72rem;color:var(--muted);font-weight:700;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--panel)}
th:first-child,td:first-child{text-align:left}
td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
td .nm{max-width:200px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom;font-weight:700}
.tag{display:inline-block;font-size:.66rem;font-weight:700;padding:0 6px;border-radius:999px;margin-left:3px;background:var(--cs);color:var(--c)}
.brandbar{display:flex;justify-content:center;margin-bottom:-4px}
.brandbar img{height:34px;width:auto}
.logo-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:inline}}
:root[data-theme="dark"] .logo-l{display:none}:root[data-theme="dark"] .logo-d{display:inline}
#chart{position:relative}
.tip{position:absolute;top:-6px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.75rem;box-shadow:0 4px 14px rgb(0 0 0 / .12);pointer-events:none;max-width:100%}
.tip .tv{font-size:1rem;font-weight:600;color:var(--accent)}
rect.hit{cursor:pointer}
.navlink{font-size:.8rem;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 12px;background:var(--panel)}
.navlink:hover,.navlink:focus-visible{border-color:var(--accent)}
.foot{font-size:.75rem;color:var(--muted);line-height:1.7}
.foot p{margin:0;max-width:80ch}
</style>

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const SIG = {
  jump:   {t:"前日から急伸", d:"前日ダイヤ3万↑かつ直近7日平均の3倍↑", c:"--up"},
  good:   {t:"いい動き", d:"直近7日が前週の1.5倍↑ または7日連続配信", c:"--accent"},
  bsurge: {t:"バトル急増", d:"前日バトル5回↑かつ7日平均の3倍↑", c:"--info"},

const cvar = k => `--c:var(${SIG[k].c});--cs:var(${soft[SIG[k].c]})`;

function spark(vals, color, w = 84, h = 24) {
  const m = Math.max(...vals, 1), bw = w / vals.length;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">` + vals.map((v, i) => {
    const bh = v > 0 ? Math.max(2, v / m * (h - 2)) : 1;
    return `<rect x="${i * bw + .5}" y="${h - bh}" width="${bw - 1.5}" height="${bh}" rx="1" fill="${v > 0 ? `var(${color})` : "var(--line)"}" opacity="${i === vals.length - 1 ? 1 : .55}"/>`;
  }).join("") + `</svg>`;
}

document.getElementById("asof").innerHTML = `データ基準日 <b class="num">${D.asof}</b>（${D.ym.slice(5)}月${D.day}日目 / ${D.dim}日）・生成 ${esc(D.built)}`;
const ratio = D.plan ? D.landing / D.plan : null;
document.getElementById("mtitle").innerHTML = `${+D.ym.slice(5)}月の着地見込み ` + (ratio == null ? "" : `<span class="pill ${ratio >= 1 ? "ok" : "ng"}">計画比 ${(ratio * 100).toFixed(1)}%</span>`);
document.getElementById("meter").innerHTML = `
  <div><span class="lab">実績（${D.day}日分）</span><span class="big">${yen(D.actual)}</span></div>
  <span class="arrow">→</span>
  <div><span class="lab">着地（日割り×${D.dim}日）</span><span class="big" style="color:var(--accent)">${yen(D.landing)}</span></div>
  <span class="arrow">／</span>
  <div><span class="lab">計画</span><span class="big" style="color:var(--plan)">${D.plan ? yen(D.plan) : "未設定"}</span></div>`;
const scale = Math.max(D.landing, D.plan || 0) * 1.05;
const pacePlan = D.plan ? D.plan * D.day / D.dim : null;
document.getElementById("bar").innerHTML =
  `<div class="proj" style="width:${D.landing / scale * 100}%"></div><div class="fill" style="width:${D.actual / scale * 100}%"></div>` +
  (D.plan ? `<div class="tick" style="left:${D.plan / scale * 100}%" title="計画"></div>` : "");
document.getElementById("barleg").innerHTML =
  `<span><i class="sw" style="background:var(--accent)"></i>実績</span><span><i class="sw" style="background:var(--accent-soft)"></i>着地見込み</span><span><i class="sw" style="background:var(--plan)"></i>計画</span>` +
  (pacePlan ? `<span>今日時点の計画ペース ${yen(pacePlan)}（差 <b class="num" style="color:var(${D.actual >= pacePlan ? "--up" : "--down"})">${D.actual >= pacePlan ? "+" : ""}${fmt(D.actual - pacePlan)}</b>）</span>` : "") +
  (D.plan ? `<span>残り日で計画達成に必要 1日 ${yen(Math.max(0, D.plan - D.actual) / Math.max(1, D.dim - D.day))}</span>` : "");
document.getElementById("bs").innerHTML = Object.entries(D.by_bs).map(([k, v]) => `<span>${esc(k)} <b class="num" style="color:var(--ink)">${yen(v)}</b> → 着地 ${yen(v / D.day * D.dim)}</span>`).join("");

// 佐藤さんKPI（#dcl-kpi）があればメーター上段を差し替え
if (D.kpi) {
  const k = D.kpi, dia = k.rows.find(r => r.name === "獲得ダイヤ");
  if (dia) document.getElementById("meter").innerHTML = `
    <div><span class="lab">実績</span><span class="big">${esc(dia.actual)}</span></div><span class="arrow">→</span>
    <div><span class="lab">着地（#dcl-kpi）</span><span class="big" style="color:var(--accent)">${esc(dia.forecast)}</span></div><span class="arrow">／</span>
    <div><span class="lab">計画</span><span class="big" style="color:var(--plan)">${esc(dia.plan)}</span></div>`;
  if (dia) document.getElementById("mtitle").innerHTML = `${+D.ym.slice(5)}月の着地見込み <span class="pill ${dia.pct >= 100 ? "ok" : "ng"}">計画比 ${dia.pct}%</span>`;
  document.getElementById("bs").insertAdjacentHTML("afterend", `<div class="bar-legend" style="margin-top:12px;gap:6px 18px">` +
    k.rows.map(r => `<span>${esc(r.name)} <b class="num" style="color:var(--ink)">${esc(r.actual)}</b> → 着地 <b class="num">${esc(r.forecast)}</b> ／ 計画 ${esc(r.plan)} <span class="pill ${r.pct >= 100 ? "ok" : "ng"}">${r.pct}%</span>${r.alert ? ` <span style="color:var(--down)">${esc(r.alert)}</span>` : ""}</span>`).join("") +
    `<span>出典 #dcl-kpi（佐藤さん）${esc(k.date)}・${esc(k.dom)}・取込 ${esc(k.generated)}</span></div>`);
}

// ---- daily chart (current month + tail)
(function () {
  const s = D.series.slice(-30), w = 560, h = 190, L = 44, B = 22, T = 10;
  const daily = D.plan ? D.plan / D.dim : 0;
  const max = Math.max(...s.map(x => x.dia), daily) * 1.1;
  const step = Math.pow(10, Math.floor(Math.log10(max / 4))); const tick = Math.ceil(max / 4 / step) * step;
  const y = v => T + (h - T - B) * (1 - v / max), bw = (w - L) / s.length;
  let g = "";
  for (let v = 0; v <= max; v += tick) g += `<line x1="${L}" x2="${w}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v >= 10000 ? v / 10000 + "万" : v}</text>`;
  s.forEach((x, i) => {
    const cur = x.d.slice(0, 7) === D.ym;
    g += `<rect class="hit" data-i="${i}" x="${L + i * bw}" y="${T}" width="${bw}" height="${y(0) - T}" fill="transparent"/><rect class="b" data-i="${i}" x="${L + i * bw + 1}" y="${y(x.dia)}" width="${bw - 2}" height="${y(0) - y(x.dia)}" rx="1.5" fill="var(${cur ? "--accent" : "--line"})" pointer-events="none"/>`;
    if (i % 5 === 0 || i === s.length - 1) g += `<text x="${L + i * bw + bw / 2}" y="${h - 6}" text-anchor="middle">${md(x.d)}</text>`;
  });
  if (daily) g += `<line x1="${L}" x2="${w}" y1="${y(daily)}" y2="${y(daily)}" stroke="var(--plan)" stroke-dasharray="4 3" stroke-width="1.5"/><text x="${w}" y="${y(daily) - 4}" text-anchor="end" style="fill:var(--plan)">計画ペース ${fmt(daily)}/日</text>`;
  const el = document.getElementById("chart");
  el.innerHTML = `<div class="tip" id="tip" hidden></div><svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="日別ダイヤ">${g}</svg><div class="bar-legend"><span><i class="sw" style="background:var(--accent)"></i>今月</span><span><i class="sw" style="background:var(--line)"></i>前月</span><span>棒にカーソル／タップで数字</span></div>`;
  const tip = el.querySelector("#tip"), svg = el.querySelector("svg"); let pinned = null;
  const show = (i, evx) => {
    const x = s[i], wd = "日月火水木金土"[new Date(x.d).getDay()];
    const diff = daily ? x.dia - daily : null;
    tip.innerHTML = `<b>${md(x.d)}（${wd}）</b><span class="num tv">${fmt(x.dia)}</span><span>配信 ${x.live}人${x.live ? `・1人平均 ${fmt(x.dia / x.live)}` : ""}</span>` +
      (diff != null && x.d.slice(0, 7) === D.ym ? `<span>計画ペース比 <b class="num" style="color:var(${diff >= 0 ? "--up" : "--down"})">${diff >= 0 ? "+" : ""}${fmt(diff)}</b></span>` : "");
    tip.hidden = false;
    const r = el.getBoundingClientRect(), sr = svg.getBoundingClientRect();
    const cx = sr.left - r.left + (L + (i + .5) * bw) / w * sr.width;
    tip.style.left = Math.min(Math.max(cx - tip.offsetWidth / 2, 0), r.width - tip.offsetWidth) + "px";
    svg.querySelectorAll("rect.b").forEach(b => b.style.opacity = +b.dataset.i === i ? 1 : .45);
  };
  const hide = () => { if (pinned != null) return show(pinned); tip.hidden = true; svg.querySelectorAll("rect.b").forEach(b => b.style.opacity = 1); };
  svg.querySelectorAll("rect.hit").forEach(r => {
    r.addEventListener("pointerenter", () => show(+r.dataset.i));
    r.addEventListener("click", () => { pinned = pinned === +r.dataset.i ? null : +r.dataset.i; pinned == null ? hide() : show(pinned); });
  });
  svg.addEventListener("pointerleave", hide);
  show(s.length - 1); pinned = s.length - 1;
})();

// ---- signals
const L = D.livers;
const by = k => L.filter(x => x.tags.includes(k));
const ORDER = {
  jump: (a, b) => b.y - a.y, good: (a, b) => b.l7 - a.l7, bsurge: (a, b) => b.m_y - a.m_y,
  bnone: (a, b) => b.l7 - a.l7, stop: (a, b) => b.month + b.p7 - (a.month + a.p7), new: (a, b) => b.month - a.month,
};
const VAL = {
  jump: x => [`+${fmt(x.y)}`, `7日平均 ${fmt(x.avg7)}`, x.s.dia, "--up"],
  good: x => [fmt(x.l7), `前週 ${fmt(x.p7)}・配信${x.st7}/7日`, x.s.dia, "--accent"],
  bsurge: x => [`${x.m_y}回`, `7日計 ${x.m7}回`, x.s.match, "--info"],
  bnone: x => [`0回/7日`, `配信${x.st7}日・${fmt(x.l7)}ダイヤ`, x.s.hrs, "--warn"],
  stop: x => [`${x.gap}日`, `最終 ${md(x.last)}・今月 ${fmt(x.month)}`, x.s.dia, "--down"],
  new: x => [fmt(x.month), `入会${x.since ?? "?"}日・配信${x.mdays}日`, x.s.dia, "--plan"],
};
let active = "";
function renderSignals() {
  document.getElementById("signals").innerHTML = Object.keys(SIG).map(k =>
    `<button class="sig" style="${cvar(k)}" aria-pressed="${active === k}" data-k="${k}"><span class="n">${by(k).length}</span><span class="t">${SIG[k].t}</span><span class="d">${SIG[k].d}</span></button>`).join("");
  document.querySelectorAll(".sig").forEach(b => b.onclick = () => { active = active === b.dataset.k ? "" : b.dataset.k; ftag.value = active; renderSignals(); renderLists(); renderAll(); });
}
const expanded = {};
function renderLists() {
  const keys = active ? [active] : ["jump", "good", "stop", "bsurge", "bnone"];
  document.getElementById("lists").innerHTML = keys.map(k => {
    const arr = by(k).sort(ORDER[k]); const lim = expanded[k] || active ? arr.length : 8;
    const rows = arr.slice(0, lim).map(x => { const [v, sub, sp, col] = VAL[k](x);
      return `<div class="row"><div style="min-width:0"><div class="nm" title="${esc(x.name)}">${esc(x.name)}</div><div class="sub">@${esc(x.user)}・${esc(x.bs)}・${esc(x.mgr)}</div></div><div class="val">${v}<small>${sub}</small></div>${spark(sp, col)}</div>`; }).join("");
    return `<div class="panel list" style="${cvar(k)}"><h2><i class="dot"></i>${SIG[k].t} <span class="muted num" style="font-size:.8rem">${arr.length}人</span></h2>
      ${rows || `<div class="empty">該当なし</div>`}
      ${arr.length > lim ? `<button class="more" data-k="${k}">残り${arr.length - lim}人を表示</button>` : ""}</div>`;
  }).join("");
  document.querySelectorAll(".more").forEach(b => b.onclick = () => { expanded[b.dataset.k] = 1; renderLists(); });
}

// ---- new livers
(function () {
  const arr = by("new").sort((a, b) => (a.since ?? 999) - (b.since ?? 999));
  document.getElementById("newtbl").innerHTML = `<thead><tr><th>ライバー</th><th>担当</th><th>入会</th><th>経過</th><th>初配信(観測)</th><th>最終配信</th><th>今月ダイヤ</th><th>配信日数</th><th>配信時間</th><th>バトル</th><th>新規フォロワー</th><th>直近14日ダイヤ</th><th>状態</th></tr></thead><tbody>` +
    arr.map(x => `<tr><td><span class="nm" title="${esc(x.name)}">${esc(x.name)}</span><div class="muted" style="font-size:.7rem">${esc(x.bs)}</div></td><td>${esc(x.mgr)}</td><td class="n">${md(x.join)}</td><td class="n">${x.since ?? "—"}日</td><td class="n">${x.first ? md(x.first) : "<span style='color:var(--down)'>未配信</span>"}</td><td class="n">${md(x.last)}</td><td class="n">${fmt(x.month)}</td><td class="n">${x.mdays}</td><td class="n">${x.mhrs}h</td><td class="n">${x.mmatch}</td><td class="n">${fmt(x.mfol)}</td><td>${spark(x.s.dia, "--plan")}</td><td>${x.tags.filter(t => t !== "new").map(t => `<span class="tag" style="${cvar(t)}">${SIG[t].t}</span>`).join("")}</td></tr>`).join("") + "</tbody>";
})();

// ---- all table
const q = document.getElementById("q"), fbs = document.getElementById("fbs"), fmgr = document.getElementById("fmgr"), ftag = document.getElementById("ftag");
[...new Set(L.map(x => x.mgr))].sort().forEach(m => fmgr.insertAdjacentHTML("beforeend", `<option>${esc(m)}</option>`));
Object.keys(SIG).forEach(k => ftag.insertAdjacentHTML("beforeend", `<option value="${k}">${SIG[k].t}</option>`));
const COLS = [["name", "ライバー"], ["mgr", "担当"], ["month", "今月ダイヤ"], ["y", "前日"], ["l7", "直近7日"], ["p7", "前週"], ["mdays", "配信日数"], ["mhrs", "配信h"], ["mmatch", "バトル(月)"], ["m7", "バトル(7日)"], ["last", "最終配信"], ["spark", "14日推移"]];
let sortK = "month", sortDir = -1;
function renderAll() {
  const s = q.value.trim().toLowerCase();
  let arr = L.filter(x => (!s || (x.name + x.user).toLowerCase().includes(s)) && (!fbs.value || x.bs === fbs.value) && (!fmgr.value || x.mgr === fmgr.value) && (!ftag.value || x.tags.includes(ftag.value)));
  arr.sort((a, b) => { const A = a[sortK] ?? "", B = b[sortK] ?? ""; return (A > B ? 1 : A < B ? -1 : 0) * sortDir; });
  document.getElementById("all").innerHTML = `<thead><tr>${COLS.map(([k, t]) => `<th data-k="${k}">${t}${sortK === k ? (sortDir < 0 ? " ▼" : " ▲") : ""}</th>`).join("")}</tr></thead><tbody>` +
    arr.map(x => `<tr><td><span class="nm" title="${esc(x.name)} @${esc(x.user)}">${esc(x.name)}</span>${x.tags.map(t => `<span class="tag" style="${cvar(t)}">${SIG[t].t}</span>`).join("")}</td><td>${esc(x.mgr)}</td><td class="n">${fmt(x.month)}</td><td class="n">${fmt(x.y)}</td><td class="n">${fmt(x.l7)}</td><td class="n">${fmt(x.p7)}</td><td class="n">${x.mdays}</td><td class="n">${x.mhrs}</td><td class="n">${x.mmatch}</td><td class="n">${x.m7}</td><td class="n">${md(x.last)}</td><td>${spark(x.s.dia, "--accent", 70, 18)}</td></tr>`).join("") +
    `</tbody><caption style="caption-side:bottom;text-align:left;padding-top:8px" class="muted">${arr.length}人表示</caption>`;
  document.querySelectorAll("#all th").forEach(th => th.onclick = () => { const k = th.dataset.k; if (k === "spark") return; sortDir = sortK === k ? -sortDir : (k === "name" || k === "mgr" ? 1 : -1); sortK = k; renderAll(); });
}
[q, fbs, fmgr].forEach(el => el.oninput = renderAll);
ftag.oninput = () => { active = ftag.value; renderSignals(); renderLists(); renderAll(); };

document.getElementById("foot").innerHTML = `<p>出典: スプレッドシート「TikTokLIVEハイタッチ確認」クリエイターデータ_Claude と同じ毎朝の取得データ（Backstage・2日遅れ）。日別の数字は前日スナップショットとの差分。差分の記録は ${D.history_from} から。</p><p>着地 = 実績 ÷ 経過日数 × 月日数。金額は 1ダイヤ = ¥1 換算でシート表記に合わせています。シグナルの閾値はページ内の各カードに記載。</p>`;
renderSignals(); renderLists(); renderAll();
</script>

</html>
