<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>🏆第3回 DCLトーナメント PRIDE ／ 山割り</title>
<link rel="icon" href="assets/dcl_mark.png">
<link rel="apple-touch-icon" href="assets/dcl_mark.png">
<meta property="og:title" content="第3回 DCLトーナメント PRIDE ／ 山割り">
<meta property="og:description" content="1vs1、負けたら終わり。勝ち上がりを見届けてください。決勝は11/4(水) 22:00。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Jost:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Serif+JP:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  --void:#08090c; --panel:#12141a; --panel2:#181b23; --sunk:#0d0f14;
  --line:#252932; --line-lt:#323845;
  --ink:#eef0f4; --ink-dim:#c4c9d4; --muted:#8b909d;
  --blood:#ff2b4a; --blood-dk:#c2132c; --blood-soft:rgba(255,43,74,.12);
  --corner:#3d7bff; --corner-soft:rgba(61,123,255,.12);
  --gold:#f0b429; --gold-lt:#ffdd8a; --gold-soft:rgba(240,180,41,.12);
  --silver:#c9ced8; --live:#28c76f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;
  color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 420px at 50% -6%, rgba(255,43,74,.20) 0%, rgba(255,43,74,0) 62%),
    radial-gradient(700px 380px at 100% 4%, rgba(240,180,41,.10) 0%, rgba(240,180,41,0) 58%),
    radial-gradient(700px 400px at 0% 10%, rgba(61,123,255,.10) 0%, rgba(61,123,255,0) 55%),
    linear-gradient(180deg,#0b0c11 0%, var(--void) 60%);
  background-attachment:fixed;
}
.wrap{max-width:680px;margin:0 auto;padding:20px 14px 80px}

.brandbar{display:flex;justify-content:center;margin:6px 0 16px}
.brandbar img{height:32px;width:auto;opacity:.9}

/* ── hero ── */
header.hero{position:relative;overflow:hidden;border-radius:20px;padding:26px 20px 22px;
  margin-bottom:12px;border:1px solid var(--line-lt);
  background:linear-gradient(160deg,#1a1013 0%,#0e0f14 46%,#14161d 100%);
  box-shadow:0 18px 40px rgba(0,0,0,.6)}
header.hero::before{content:"";position:absolute;left:-30%;top:-40%;width:160%;height:80%;
  transform:rotate(-14deg);pointer-events:none;
  background:linear-gradient(90deg,rgba(255,43,74,0) 0%,rgba(255,43,74,.30) 45%,rgba(255,43,74,0) 100%)}
header.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 4px)}
.hero .inner{position:relative}
.hero .eyebrow{font-family:'Jost',sans-serif;font-size:11px;font-weight:700;letter-spacing:.24em;
  text-transform:uppercase;color:var(--gold)}
.hero .mark{font-family:'Anton',sans-serif;font-size:clamp(50px,16vw,80px);line-height:.92;
  letter-spacing:.02em;margin:7px 0 2px;color:#fff;
  text-shadow:0 0 32px rgba(255,43,74,.45), 0 2px 0 rgba(0,0,0,.5)}
.hero .mark em{font-style:normal;color:var(--blood)}
.hero .jp{font-weight:800;font-size:14px;color:var(--ink-dim);margin-top:5px}
.hero .tagline{font-weight:700;font-size:13px;color:var(--gold-lt);margin-top:9px}
.hero .metarow{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;
  font-size:12px;font-weight:700;border:1px solid var(--line-lt);background:rgba(255,255,255,.04);
  color:var(--ink-dim);white-space:nowrap}
.pill.hot{border-color:rgba(255,43,74,.5);background:var(--blood-soft);color:#ffb9c4}
.pill.gold{border-color:rgba(240,180,41,.5);background:var(--gold-soft);color:var(--gold-lt)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--live);
  box-shadow:0 0 0 0 rgba(40,199,111,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(40,199,111,.5)}70%{box-shadow:0 0 0 8px rgba(40,199,111,0)}100%{box-shadow:0 0 0 0 rgba(40,199,111,0)}}
.updated{font-size:11.5px;color:var(--muted);text-align:right;margin:0 2px 14px;
  font-family:'Jost',sans-serif;letter-spacing:.03em}

.sect{display:flex;align-items:center;gap:10px;margin:30px 2px 13px}
.sect h2{margin:0;font-size:16px;font-weight:800;letter-spacing:.02em}
.sect .en{font-family:'Jost',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--blood)}
.sect .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line-lt),transparent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 8px 22px rgba(0,0,0,.45)}

/* ══ FIGHT CARD（次の一戦）══ */
.fight{position:relative;overflow:hidden;border-radius:20px;margin-bottom:14px;
  border:1px solid var(--line-lt);background:var(--panel);
  box-shadow:0 16px 36px rgba(0,0,0,.55)}
.fight .fh{display:flex;align-items:center;gap:9px;padding:11px 15px;
  background:linear-gradient(90deg,rgba(255,43,74,.20),rgba(61,123,255,.14));
  border-bottom:1px solid var(--line)}
.fight .fh .lb{font-family:'Jost',sans-serif;font-size:10.5px;font-weight:800;letter-spacing:.2em;
  text-transform:uppercase;color:#fff}
.fight .fh .rnd{font-weight:800;font-size:13px;color:#fff}
.fight .fh .when{font-family:'Jost',sans-serif;font-size:11.5px;font-weight:600;
  color:rgba(255,255,255,.72);margin-left:auto;white-space:nowrap}
.bout{display:grid;grid-template-columns:1fr 54px 1fr;align-items:stretch}
.corner{padding:18px 12px 16px;text-align:center;position:relative;min-width:0}
.corner.red{background:linear-gradient(180deg,rgba(255,43,74,.13),transparent 78%)}
.corner.blue{background:linear-gradient(180deg,rgba(61,123,255,.13),transparent 78%)}
.corner .cn{font-family:'Jost',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase}
.corner.red .cn{color:var(--blood)} .corner.blue .cn{color:var(--corner)}
.corner .sd{font-family:'Jost',sans-serif;font-size:11px;font-weight:700;color:var(--muted);
  margin-top:5px;letter-spacing:.06em}
.corner .nm{font-weight:800;font-size:clamp(15px,4.4vw,19px);line-height:1.3;margin-top:4px;
  color:#fff;word-break:break-word}
.corner .st{font-family:'Jost',sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;margin-top:7px}
.corner.win .st{color:var(--gold-lt)} .corner.lose{opacity:.45}
.corner.win::after{content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(240,180,41,.55);border-radius:2px}
.vsmid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:var(--sunk);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.vsmid b{font-family:'Anton',sans-serif;font-size:20px;color:var(--blood);line-height:1;
  text-shadow:0 0 16px rgba(255,43,74,.5)}
.fight .cd{display:flex;gap:7px;padding:13px 14px 15px;border-top:1px solid var(--line);
  background:var(--sunk)}
.fight .cd div{flex:1;text-align:center;background:rgba(255,255,255,.03);
  border:1px solid var(--line);border-radius:10px;padding:8px 3px}
.fight .cd b{display:block;font-family:'Jost',sans-serif;font-size:22px;font-weight:800;
  font-variant-numeric:tabular-nums;line-height:1.1;color:#fff}
.fight .cd span{font-size:9.5px;color:var(--muted);font-family:'Jost',sans-serif;
  letter-spacing:.14em;text-transform:uppercase}
.fight .teaser{padding:20px 18px 18px;text-align:center}
.fight .teaser .big{font-family:'Anton',sans-serif;font-size:clamp(22px,6.4vw,30px);color:#fff;
  letter-spacing:.02em;line-height:1.2}
.fight .teaser .sub{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.75}
.fight .champ{padding:22px 18px 20px;text-align:center;
  background:linear-gradient(180deg,rgba(240,180,41,.16),transparent 80%)}
.fight .champ .c{font-size:38px;line-height:1}
.fight .champ .l{font-family:'Jost',sans-serif;font-size:10px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold);margin-top:5px}
.fight .champ .v{font-family:'Anton',sans-serif;font-size:clamp(24px,7vw,34px);color:var(--gold-lt);
  margin-top:4px;line-height:1.15}

/* 次のラウンド＝全試合を横スライド */
.fight .fmeta{display:flex;align-items:center;gap:8px;padding:11px 15px 0}
.fight .fmeta .n{font-family:'Jost',sans-serif;font-size:11px;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;color:var(--gold)}
.fight .fmeta .t{font-size:12.5px;font-weight:700;color:var(--ink-dim)}
.fcar{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;
  scrollbar-width:none}
.fcar::-webkit-scrollbar{display:none}
.fslide{flex:0 0 100%;scroll-snap-align:center;min-width:0}
.fslide .mid{display:flex;align-items:center;gap:8px;padding:9px 15px 0}
.fslide .mid .id{font-family:'Jost',sans-serif;font-size:10px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.fslide .mid .st{font-family:'Jost',sans-serif;font-size:10px;font-weight:800;letter-spacing:.12em;
  text-transform:uppercase;margin-left:auto}
.fslide .mid .st.d{color:var(--gold-lt)}
.fslide .mid .st.w{color:#ffb9c4}
.fight .fdots{display:flex;justify-content:center;align-items:center;gap:6px;padding:4px 0 14px}
.fight .fdots i{width:7px;height:7px;border-radius:50%;background:var(--line-lt);transition:.2s}
.fight .fdots i.on{background:var(--blood);width:22px;border-radius:4px}
.fight .fswipe{display:flex;align-items:center;justify-content:center;gap:7px;
  font-family:'Jost',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);padding:2px 0 0}
.fight .fswipe::before,.fight .fswipe::after{content:"";width:22px;height:1px;background:var(--line-lt)}

/* ══ ROUND STEPPER ══ */
.stepper{display:flex;align-items:flex-start;padding:15px 8px 13px;margin-bottom:14px;
  overflow-x:auto;-webkit-overflow-scrolling:touch}
.step{flex:1 0 auto;min-width:74px;text-align:center;position:relative;padding:0 2px}
.step::before{content:"";position:absolute;top:9px;left:0;right:50%;height:2px;background:var(--line)}
.step::after{content:"";position:absolute;top:9px;left:50%;right:0;height:2px;background:var(--line)}
.step:first-child::before,.step:last-child::after{display:none}
.step.done::before,.step.done::after,.step.cur::before{background:var(--blood)}
.step i{position:relative;z-index:1;display:block;width:20px;height:20px;margin:0 auto;
  border-radius:50%;background:var(--sunk);border:2px solid var(--line)}
.step.done i{background:var(--blood);border-color:var(--blood)}
.step.cur i{background:var(--void);border-color:var(--blood);
  box-shadow:0 0 0 4px rgba(255,43,74,.18)}
.step.fin i{border-color:var(--gold)}
.step.fin.done i{background:var(--gold);border-color:var(--gold)}
.step b{display:block;font-size:11.5px;font-weight:800;margin-top:7px;color:var(--ink-dim);
  white-space:nowrap}
.step.cur b{color:#fff}
.step span{display:block;font-family:'Jost',sans-serif;font-size:10px;color:var(--muted);
  margin-top:2px;white-space:nowrap}

/* ══ SURVIVORS ══ */
.survive{padding:15px 15px 13px}
.survive .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:11px}
.survive .hd b{font-family:'Jost',sans-serif;font-size:22px;font-weight:800;color:var(--gold);
  line-height:1;font-variant-numeric:tabular-nums}
.survive .hd span{font-size:12.5px;color:var(--muted);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.ch{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 13px;
  font-size:13px;font-weight:700;border:1px solid rgba(240,180,41,.45);
  background:var(--gold-soft);color:var(--gold-lt);max-width:100%}
.ch .s{font-family:'Jost',sans-serif;font-size:10.5px;font-weight:700;color:var(--gold);
  opacity:.85;flex:0 0 auto}
.ch .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch.out{border-color:var(--line);background:transparent;color:var(--muted);opacity:.65}
.ch.out .t{text-decoration:line-through;text-decoration-thickness:1px}
.ch.out .s{color:var(--muted)}
.survive .outhd{font-size:11.5px;font-weight:700;color:var(--muted);margin:15px 0 9px;
  padding-top:13px;border-top:1px solid var(--line)}

/* ══════════ トーナメント表（強化版） ══════════ */
.brpanel{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line-lt);
  background:radial-gradient(600px 260px at 88% 12%, rgba(240,180,41,.10), transparent 62%),
             radial-gradient(500px 240px at 6% 88%, rgba(255,43,74,.10), transparent 60%),
             var(--sunk);
  box-shadow:0 16px 36px rgba(0,0,0,.55)}
.brpanel::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 5px)}
.brwrap{position:relative;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:18px 15px 20px}
.brscroll{display:flex;align-items:stretch;min-width:860px}
.bcol{display:flex;flex-direction:column;flex:0 0 192px}
.bcol .clab{text-align:center;margin-bottom:12px;position:relative;padding-bottom:10px}
.bcol .clab::after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--line-lt),transparent)}
.bcol .clab u{display:block;text-decoration:none;font-family:'Anton',sans-serif;
  font-size:20px;line-height:1;color:var(--line-lt);letter-spacing:.04em}
.bcol .clab b{display:block;font-size:12.5px;font-weight:800;color:var(--ink-dim);
  white-space:nowrap;margin-top:3px}
.bcol .clab i{display:block;font-style:normal;font-family:'Jost',sans-serif;font-size:10px;
  color:var(--muted);margin-top:2px;letter-spacing:.04em}
.bcol.now .clab u{color:var(--blood)}
.bcol.now .clab b{color:#fff}
.bcol.now .clab::after{background:linear-gradient(90deg,transparent,var(--blood),transparent)}
.bcol.fin .clab u{color:var(--gold)}
.bcol .cbody{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.bmatch{position:relative;background:linear-gradient(160deg,#161a22,#10131a);
  border:1px solid var(--line);overflow:hidden;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.bmatch.done{border-color:rgba(240,180,41,.34);
  background:linear-gradient(160deg,#1c1a12,#10131a)}
.bmatch.next{border-color:rgba(255,43,74,.6);
  background:linear-gradient(160deg,#221217,#10131a);
  box-shadow:0 0 0 3px rgba(255,43,74,.10), 0 0 22px rgba(255,43,74,.22)}
.bmatch .mtag{position:absolute;right:0;top:0;font-family:'Jost',sans-serif;font-size:8.5px;
  font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  padding:2px 7px;background:rgba(255,255,255,.05)}
.bmatch.next .mtag{color:#fff;background:var(--blood)}
.bslot{display:flex;align-items:center;gap:8px;padding:10px 10px;min-height:40px;position:relative}
.bslot + .bslot{border-top:1px solid var(--line)}
.bslot .s{font-family:'Jost',sans-serif;font-size:10.5px;font-weight:800;color:var(--muted);
  width:20px;height:20px;flex:0 0 auto;display:grid;place-items:center;
  background:rgba(255,255,255,.05);font-variant-numeric:tabular-nums;
  clip-path:polygon(3px 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 3px)}
.bslot .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:13.5px;font-weight:700;color:var(--ink-dim)}
.bslot .k{font-size:13px;flex:0 0 auto;opacity:0}
.bslot.win{background:linear-gradient(90deg,rgba(240,180,41,.24),rgba(240,180,41,.03))}
.bslot.win::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--gold-lt),var(--gold))}
.bslot.win .n{color:#fff}
.bslot.win .s{color:#1b1403;background:var(--gold)}
.bslot.win .k{opacity:1;filter:drop-shadow(0 0 6px rgba(240,180,41,.8))}
.bslot.lose{opacity:.34}
.bslot.lose .n{text-decoration:line-through;text-decoration-thickness:1px}
.bslot.wd{opacity:.62}
.corner.wd{opacity:.62}
.bslot.tbd .n{color:#565b66;font-weight:500}
.bslot.bye .n{color:var(--muted);font-style:italic}
.brscroll{position:relative}
.brlines{position:absolute;left:0;top:0;pointer-events:none;z-index:0;overflow:visible}
.brlines path{fill:none;stroke:var(--line-lt);stroke-width:1.5;stroke-linecap:round}
.brlines path.lit{stroke:rgba(240,180,41,.75);filter:drop-shadow(0 0 5px rgba(240,180,41,.45))}
.brlines circle{fill:var(--line-lt)}
.brlines circle.lit{fill:var(--gold)}
.bcol,.bfinal{position:relative;z-index:1}
.bgap{flex:0 0 38px}
/* 凡例 */
.legend{display:flex;flex-wrap:wrap;gap:9px 16px;padding:12px 15px 13px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;
  color:var(--muted);white-space:nowrap}
.legend i{display:inline-block;width:13px;height:13px;flex:0 0 auto;
  clip-path:polygon(3px 0,100% 0,100% calc(100% - 3px),calc(100% - 3px) 100%,0 100%,0 3px)}
.legend i.g{background:var(--gold)}
.legend i.r{background:transparent;border:1.5px solid var(--blood);box-shadow:0 0 8px rgba(255,43,74,.4)}
.legend i.l{background:var(--line-lt)}
.legend i.b{background:transparent;border:1.5px dashed var(--line-lt)}
.bfinal{flex:0 0 178px;display:flex;flex-direction:column;justify-content:center;padding-top:44px}
.bcrown{position:relative;border:1px solid rgba(240,180,41,.55);padding:17px 12px;text-align:center;
  background:linear-gradient(160deg,rgba(240,180,41,.20),rgba(13,15,20,.9) 72%);
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)}
.bcrown.won{animation:crownGlow 2.6s ease-in-out infinite}
@keyframes crownGlow{0%,100%{box-shadow:0 0 0 0 rgba(240,180,41,0)}50%{box-shadow:0 0 26px 2px rgba(240,180,41,.3)}}
.bcrown .c{font-size:32px;line-height:1;filter:drop-shadow(0 0 12px rgba(240,180,41,.55))}
.bcrown .l{font-family:'Jost',sans-serif;font-size:9.5px;font-weight:800;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold);margin-top:6px}
.bcrown .v{font-size:14.5px;font-weight:800;color:var(--gold-lt);margin-top:3px;line-height:1.35}

/* ══════════ 対戦表カルーセル（横スワイプ） ══════════ */
.pickbar{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding:2px 2px 12px;scrollbar-width:none}
.pickbar::-webkit-scrollbar{display:none}
.pick{flex:0 0 auto;border:1px solid var(--line-lt);border-radius:999px;padding:7px 14px;
  font-size:12.5px;font-weight:700;color:var(--ink-dim);background:var(--panel);cursor:pointer;
  white-space:nowrap;font-family:'Noto Sans JP',sans-serif;transition:.16s}
.pick:hover{border-color:var(--muted)}
.pick.on{background:var(--blood);border-color:var(--blood);color:#fff}
.pick.out{opacity:.45}
.pick.out span{text-decoration:line-through}
.mcar{display:flex;gap:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scroll-snap-type:x mandatory;padding:2px 0 4px;scrollbar-width:none}
.mcar::-webkit-scrollbar{display:none}
.mcard{flex:0 0 min(88%,352px);scroll-snap-align:center;position:relative;overflow:hidden;
  border-radius:18px;border:1px solid var(--line-lt);background:var(--panel);
  box-shadow:0 14px 32px rgba(0,0,0,.5)}
.mcard.done{border-color:rgba(240,180,41,.34)}
.mcard.next{border-color:rgba(255,43,74,.6);box-shadow:0 0 26px rgba(255,43,74,.16)}

    const sd = p && p.seed != null ? `SEED ${p.seed}` : "&nbsp;";
    const st = dec ? (isWin ? "WIN 👑" : "LOSE") : "&nbsp;";
    return `<div class="corner ${cls}${dec ? (isWin ? " win" : (p && p.withdrew ? " wd" : " lose")) : ""}">
      <div class="cn">${corner}</div><div class="sd">${sd}</div>
      <div class="nm">${nm}</div><div class="st">${st}</div></div>`;
  };

  const slides = ms.map(m => {
    const dec = !!m.winner;
    const stat = dec
      ? `<span class="st d">勝者 ${esc(((m.winner === "a" ? m.a : m.b) || {}).name || "")}</span>`
      : `<span class="st w">試合前</span>`;
    return `<div class="fslide">
      <div class="mid"><span class="id">${esc(m.id || "")}</span>${stat}</div>
      <div class="bout">
        ${side(m.a, "red", "Red corner", m.winner === "a", dec)}
        <div class="vsmid"><b>VS</b></div>
        ${side(m.b, "blue", "Blue corner", m.winner === "b", dec)}
      </div></div>`;
  }).join("");

  const left = ms.filter(m => !m.winner).length;
  box.innerHTML = `<div class="fh">
      <span class="lb">Next</span><span class="rnd">${esc(RD.name)}</span>
      <span class="when">${esc(RD.date || "")} 22:00〜</span></div>
    <div class="fmeta"><span class="n">${ms.length} matches</span>
      <span class="t">全${ms.length}試合が22:00に同時スタート${left && left < ms.length ? `（残り${left}試合）` : ""}</span></div>
    ${at ? CD : ""}
    <div class="fcar" id="fcar">${slides}</div>
    ${ms.length > 1 ? `<div class="fdots" id="fdots">${ms.map((_,i)=>`<i${i===0?' class="on"':""}></i>`).join("")}</div>
      <div class="fswipe">Swipe</div><div style="height:12px"></div>` : `<div style="height:14px"></div>`}`;

  if (at) {
    const t = new Date(at), cells = box.querySelectorAll(".cd b");
    (function tick(){
      let d = t - new Date();
      if (d <= 0) { cells.forEach(c => c.textContent = "0"); return; }
      const sec = Math.floor(d/1000);
      const v = [Math.floor(sec/86400), Math.floor(sec%86400/3600), Math.floor(sec%3600/60), sec%60];
      cells.forEach((c,i) => c.textContent = i === 0 ? String(v[i]) : pad(v[i]));
      setTimeout(tick, 1000);
    })();
  }

  const car = $("fcar"), dotsEl = $("fdots");
  if (car && dotsEl) {
    const dots = dotsEl.children, sl = car.children;
    let raf = 0;
    car.addEventListener("scroll", () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        const mid = car.scrollLeft + car.clientWidth / 2;
        let best = 0, bd = Infinity;
        for (let i = 0; i < sl.length; i++) {
          const c = sl[i], cm = c.offsetLeft + c.offsetWidth / 2, dd = Math.abs(cm - mid);
          if (dd < bd) { bd = dd; best = i; }
        }
        for (let i = 0; i < dots.length; i++) dots[i].className = i === best ? "on" : "";
      });
    }, { passive:true });
    // 未消化の最初の試合に合わせる
    const fi = ms.findIndex(m => !m.winner);
    if (fi > 0) requestAnimationFrame(() => sl[fi].scrollIntoView({ inline:"center", block:"nearest" }));
  }
})();

/* ── ROUND STEPPER ── */
(function(){
  const PRE = DATA.nights || [];
  const rounds = HAS ? DATA.rounds
    : DATA.skeleton.map((k,i) => ({ name:k.name, date:(PRE[i] || "") + (PRE[i] ? " 予定" : "") }));
  $("stepper").innerHTML = rounds.map((r,i) => {
    const allDone = HAS && DATA.rounds[i].matches.every(m => m.winner);
    const cur = HAS && i === NRI;
    const fin = /^決勝/.test(r.name);
    const cls = ["step", allDone ? "done" : "", cur ? "cur" : "", fin ? "fin" : ""].filter(Boolean).join(" ");
    return `<div class="${cls}"><i></i><b>${esc(r.name)}</b><span>${esc(r.date || "—")}</span></div>`;
  }).join("");
})();

/* ── SURVIVORS ── */
(function(){
  const area = $("surviveArea");
  if (!area) return;                 // 勝ち上がりブロックは非表示
  if (!HAS) {
    if (!DATA.entrants || !DATA.entrants.length) {
      area.innerHTML = `<div class="sect"><span class="en">Entrants</span><h2>出場者</h2><span class="rule"></span></div>
        <div class="card survive"><div class="hd"><b>10/21</b><span>出場者発表</span></div>
        <div style="font-size:13px;color:var(--muted);line-height:1.8">決まりしだい、ここに全員のお名前が並びます。<br>
          出場者は招待制で選ばれています。</div></div>`;
      return;
    }
    area.innerHTML = `<div class="sect"><span class="en">Entrants</span><h2>出場者</h2><span class="rule"></span></div>
      <div class="card survive"><div class="hd"><b>${DATA.entrants.length}</b><span>人が出場します</span></div>
      <div class="chips">${DATA.entrants.map(e =>
        `<span class="ch"><span class="s">${esc(e.seed != null ? e.seed : "")}</span><span class="t">${esc(e.name)}</span></span>`).join("")}</div></div>`;
    return;
  }
  // 敗者を集める
  const out = new Set();
  for (const r of DATA.rounds) for (const m of r.matches) {
    if (!m.winner) continue;
    const l = m.winner === "a" ? m.b : m.a;
    if (l && l.name) out.add(l.name);
  }
  const all = (DATA.entrants && DATA.entrants.length) ? DATA.entrants : [];
  const alive = all.filter(e => !out.has(e.name));
  const dead  = all.filter(e =>  out.has(e.name));
  const chip = (e, cls) =>
    `<span class="ch ${cls}"><span class="s">${esc(e.seed != null ? e.seed : "")}</span><span class="t">${esc(e.name)}</span></span>`;
  area.innerHTML = `<div class="sect"><span class="en">Survivors</span><h2>勝ち上がり</h2><span class="rule"></span></div>
    <div class="card survive">
      <div class="hd"><b>${alive.length}</b><span>人が残っています</span></div>
      <div class="chips">${alive.map(e => chip(e,"")).join("") || '<span style="font-size:13px;color:var(--muted)">—</span>'}</div>
      ${dead.length ? `<div class="outhd">敗退 ${dead.length}人</div>
        <div class="chips">${dead.map(e => chip(e,"out")).join("")}</div>` : ""}
    </div>`;
})();

/* ── BRACKET（トーナメント表）── */
(function(){
  const area = $("bracketArea");
  const bslot = (p, isWin, decided) => {
    let cls = "bslot", seed = "–", name = "未定";
    if (!p) cls += " tbd";
    else {
      seed = p.seed != null ? p.seed : "–";
      name = esc(p.name);
      if (p.bye) { cls += " bye"; name += "（シード）"; }
    }
    if (decided) cls += isWin ? " win" : ((p && p.withdrew) ? " wd" : " lose");
    const crown = (decided && isWin) ? '<span class="k">👑</span>' : "";
    return `<div class="${cls}"><span class="s">${esc(seed)}</span>
      <span class="n">${name}</span>${crown}</div>`;
  };
  const cols = HAS
    ? DATA.rounds.map(r => ({ name:r.name, date:r.date || "", matches:r.matches }))
    : DATA.skeleton.map((k,i) => ({ name:k.name, date:(((DATA.nights||[])[i]) || "") + " 予定",
        matches:Array.from({length:k.n},()=>({a:null,b:null,winner:""})) }));

  const parts = [];
  cols.forEach((c, ci) => {
    const fin = /^決勝/.test(c.name);
    const boxes = c.matches.map(m => {
      const dec = !!m.winner;
      const isNext = ci === NRI && !dec;
      const tag = isNext ? "NEXT" : (dec ? "DONE" : (m.id || ""));
      return `<div class="bmatch${dec ? " done" : ""}${isNext ? " next" : ""}" data-c="${ci}">
        ${tag ? `<span class="mtag">${esc(tag)}</span>` : ""}
        ${bslot(m.a, m.winner === "a", dec)}
        ${bslot(m.b, m.winner === "b", dec)}</div>`;
    }).join("");
    parts.push(`<div class="bcol${ci === NRI ? " now" : ""}${fin ? " fin" : ""}" data-col="${ci}">
      <div class="clab"><u>${String(ci+1).padStart(2,"0")}</u><b>${esc(c.name)}</b><i>${esc(c.date || "—")}</i></div>
      <div class="cbody">${boxes}</div></div>`);
    if (cols[ci+1]) parts.push('<div class="bgap"></div>');
  });
  const lm = cols[cols.length-1] && cols[cols.length-1].matches[0];
  const won = !!(DATA.champion || (lm && lm.winner));
  const champ = DATA.champion ? esc(DATA.champion)
    : (lm && lm.winner ? esc((lm.winner === "a" ? lm.a : lm.b).name) : "未定");
  parts.push('<div class="bgap"></div>');
  parts.push(`<div class="bfinal"><div class="bcrown${won ? " won" : ""}">
    <div class="c">🏆</div><div class="l">Champion</div><div class="v">${champ}</div></div></div>`);

  area.innerHTML = `<div class="sect"><span class="en">Bracket</span><h2>トーナメント表</h2><span class="rule"></span></div>
    <div class="brpanel"><div class="brwrap"><div class="brscroll" id="brs">
      <svg class="brlines" id="brl" aria-hidden="true"></svg>${parts.join("")}</div></div></div>
    <div class="swipe">Swipe</div>
    <div class="brpanel legend">
      <span><i class="g"></i>勝ち上がり</span>
      <span><i class="r"></i>次の試合</span>
      <span><i class="b"></i>まだ未定</span>
      <span><i class="l"></i>線は勝った人の進む先</span>
    </div>
    `;

  /* ── 実際の座標から連結線を引く ── */
  const scroll = document.getElementById("brs");
  const svg = document.getElementById("brl");
  const SVGNS = "http://www.w3.org/2000/svg";

  // 前ラウンド→次ラウンドの対応。同数なら1:1（BYEのラウンド）、倍なら2:1
  function mapping(prevN, nextN, nextMatches){
    // データ側が src（前ラウンドの試合番号）を持っていればそれに従う（BYEが偏る山割り用）
    if (nextMatches && nextMatches.some(m => Array.isArray(m.src)))
      return nextMatches.map(m => Array.isArray(m.src) ? m.src : []);
    if (prevN === nextN) return Array.from({length:nextN}, (_,i)=>[i]);
    if (prevN === nextN * 2) return Array.from({length:nextN}, (_,i)=>[2*i, 2*i+1]);
    return null;
  }

  function draw(){
    const base = scroll.getBoundingClientRect();
    if (!base.width) return;
    svg.setAttribute("width", scroll.scrollWidth);
    svg.setAttribute("height", scroll.offsetHeight);
    svg.setAttribute("viewBox", `0 0 ${scroll.scrollWidth} ${scroll.offsetHeight}`);
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    const byCol = cols.map((_, ci) =>
      [...scroll.querySelectorAll(`.bmatch[data-c="${ci}"]`)]);
    const rect = el => {
      const r = el.getBoundingClientRect();
      return { l:r.left-base.left, r:r.right-base.left, t:r.top-base.top, b:r.bottom-base.top,
               cy:(r.top+r.bottom)/2-base.top };
    };
    const line = (x1,y1,x2,y2,mx,lit) => {
      const pth = document.createElementNS(SVGNS,"path");
      pth.setAttribute("d", `M ${x1} ${y1} H ${mx} V ${y2} H ${x2}`);
      if (lit) pth.setAttribute("class","lit");
      svg.appendChild(pth);
      const dot = document.createElementNS(SVGNS,"circle");
      dot.setAttribute("cx", x1); dot.setAttribute("cy", y1); dot.setAttribute("r", 2.6);
      if (lit) dot.setAttribute("class","lit");
      svg.appendChild(dot);
    };

    for (let ci = 0; ci < cols.length - 1; ci++) {
      const map = mapping(cols[ci].matches.length, cols[ci+1].matches.length, cols[ci+1].matches);
      if (!map) continue;
      map.forEach((srcIdx, ti) => {
        const tEl = byCol[ci+1][ti]; if (!tEl) return;
        const T = rect(tEl);
        const mx = T.l - 19;
        srcIdx.forEach(si => {
          const sEl = byCol[ci][si]; if (!sEl) return;
          const S = rect(sEl);
          const lit = !!cols[ci].matches[si].winner;
          line(S.r, S.cy, T.l, T.cy, mx, lit);
        });
      });
    }
    // 決勝 → 優勝枠
    const fEl = byCol[cols.length-1][0], cEl = scroll.querySelector(".bcrown");
    if (fEl && cEl) {
      const S = rect(fEl), C = rect(cEl);
      line(S.r, S.cy, C.l, C.cy, C.l - 19, won);
    }
  }

  requestAnimationFrame(draw);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
  window.addEventListener("resize", () => { clearTimeout(window.__brT); window.__brT = setTimeout(draw, 120); });
  setTimeout(draw, 600);
})();

/* ── 対戦表カルーセル（横スワイプで試合を切り替え／名前で飛ぶ）── */
(function(){
  const area = $("cardArea");
  if (!HAS) return;

  const all = [];
  DATA.rounds.forEach((r, ri) => r.matches.forEach(m => all.push({ r, ri, m })));

  const side = (p, cls, corner, isWin, dec) => {
    const nm = p ? esc(p.name) : "未定";
    const sd = p && p.seed != null ? `SEED ${p.seed}` : "&nbsp;";
    const st = dec ? (isWin ? "WIN 👑" : "LOSE") : "&nbsp;";
    const k  = dec ? (isWin ? " win" : (p && p.withdrew ? " wd" : " lose")) : "";
    return `<div class="corner ${cls}${k}">
      <div class="cn">${corner}</div><div class="sd">${sd}</div>
      <div class="nm">${nm}</div><div class="st">${st}</div></div>`;
  };

  const cards = all.map(({ r, m }, i) => {
    const dec = !!m.winner;
    const isNext = NX && m === NX;
    const rs = dec
      ? `勝者　${esc(((m.winner === "a" ? m.a : m.b) || {}).name || "")}`
      : (isNext ? "次の試合" : "試合前");
    return `<div class="mcard${dec ? " done" : ""}${isNext ? " next" : ""}" data-i="${i}">
      <div class="mh"><span class="rn">${esc(r.name)}</span>
        <span class="id">${esc(m.id || "")}</span>
        <span class="when">${esc(r.date || "")} 22:00〜</span></div>
      <div class="bout">
        ${side(m.a, "red", "Red corner", m.winner === "a", dec)}
        <div class="vsmid"><b>VS</b></div>
        ${side(m.b, "blue", "Blue corner", m.winner === "b", dec)}
      </div>
      <div class="rslt">${rs}</div></div>`;
  }).join("");

  // 名前で飛ぶチップ（出場者順）
  const out = new Set();
  DATA.rounds.forEach(r => r.matches.forEach(m => {
    if (!m.winner) return;
    const l = m.winner === "a" ? m.b : m.a;
    if (l && l.name) out.add(l.name);
  }));
  const picks = (DATA.entrants || []).map(e => {
    const idx = all.findIndex(({ m }) =>
      (m.a && m.a.name === e.name) || (m.b && m.b.name === e.name));
    if (idx < 0) return "";
    return `<button type="button" class="pick${out.has(e.name) ? " out" : ""}" data-go="${idx}">
      <span>${esc(e.name)}</span></button>`;
  }).filter(Boolean).join("");

  area.innerHTML = `<div class="sect"><span class="en">Match cards</span><h2>対戦表</h2><span class="rule"></span></div>
    ${picks ? `<div class="pickbar">${picks}</div>` : ""}
    <div class="mcar" id="mcar">${cards}</div>
    <div class="dots" id="dots">${all.map((_,i)=>`<i${i===0?' class="on"':""}></i>`).join("")}</div>
    <p class="brnote">← → 横にスワイプして試合を切り替えられます。上の名前をタップすると、その人の試合まで飛びます。</p>`;

  const car = $("mcar"), dots = $("dots").children, cardEls = car.children;
  const go = i => cardEls[i] && cardEls[i].scrollIntoView({ behavior:"smooth", inline:"center", block:"nearest" });
  area.querySelectorAll(".pick").forEach(btn => btn.addEventListener("click", () => {
    area.querySelectorAll(".pick").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    go(+btn.dataset.go);
  }));
  let raf = 0;
  car.addEventListener("scroll", () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const mid = car.scrollLeft + car.clientWidth / 2;
      let best = 0, bd = Infinity;
      for (let i = 0; i < cardEls.length; i++) {
        const c = cardEls[i], cm = c.offsetLeft + c.offsetWidth / 2;
        const d = Math.abs(cm - mid);
        if (d < bd) { bd = d; best = i; }
      }
      for (let i = 0; i < dots.length; i++) dots[i].className = i === best ? "on" : "";
    });
  }, { passive:true });
  // 次の試合を最初に見せる
  const ni = all.findIndex(({ m }) => NX && m === NX);
  if (ni > 0) requestAnimationFrame(() => cardEls[ni].scrollIntoView({ inline:"center", block:"nearest" }));
})();

/* ── OPENING（入場演出）── */
(function(){
  const el = document.getElementById("intro");
  if (!el) return;
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let seen = false;
  try { seen = sessionStorage.getItem("pride3-intro") === "1"; } catch(e){}
  if (reduce || seen) { el.remove(); document.body.classList.remove("intro-on"); return; }
  try { sessionStorage.setItem("pride3-intro", "1"); } catch(e){}
  // Anton が来てから走らせる（代替フォント表示中にスラムが終わるのを防ぐ）
  const go = () => { el.classList.add("go"); setTimeout(close, 3000); };
  const fontReady = (document.fonts && document.fonts.load)
    ? document.fonts.load('400 100px Anton', 'PRIDE').catch(() => {})
    : Promise.resolve();
  Promise.race([fontReady, new Promise(r => setTimeout(r, 1400))]).then(() => requestAnimationFrame(go));
  let closed = false;
  function close(){
    if (closed) return; closed = true;
    el.classList.add("out");
    document.body.classList.remove("intro-on");
    setTimeout(() => el.remove(), 700);
  }
  el.addEventListener("click", close);
})();

/* ── share ── */
(function(){
  const url = location.href.split("#")[0];
  const text = "🏆第3回 DCLトーナメント PRIDE の山割り";
  $("xBtn").href = "https://twitter.com/intent/tweet?text=" +
    encodeURIComponent(text) + "&url=" + encodeURIComponent(url);
  const btn = $("copyBtn");
  btn.addEventListener("click", function(){
    const done = () => {
      btn.textContent = "✅ コピーしました";
      btn.classList.add("ok");
      setTimeout(() => { btn.textContent = "🔗 リンクをコピー"; btn.classList.remove("ok"); }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, fb);
    } else fb();
    function fb(){
      const ta = document.createElement("textarea");
      ta.value = url; ta.setAttribute("readonly","");
      ta.style.position = "fixed"; ta.style.top = "-1000px";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch(e){}
      setTimeout(() => ta.remove(), 50);
    }
  });
})();
