<style>
:root{
  --gold:#d4af37; --gold-lt:#f7e08a; --gold-dk:#8a6d1f;
  --shu:#b3202a; --shu-lt:#e24a35; --ember:#ff7a1a;
  --ink:#f4ecdc; --muted:#b9a888; --line:#3a2e22;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Noto Serif JP','Hiragino Mincho ProN',serif;
  color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 480px at 50% -8%, rgba(255,122,26,.14) 0%, rgba(255,122,26,0) 55%),
    radial-gradient(900px 460px at 8% 6%, rgba(179,32,42,.24) 0%, rgba(179,32,42,0) 52%),
    radial-gradient(900px 460px at 100% 8%, rgba(179,32,42,.20) 0%, rgba(179,32,42,0) 52%),
    linear-gradient(180deg,#0e0b09 0%, #080605 100%);
  background-attachment:fixed;position:relative;overflow-x:hidden;
}
/* ───── 戦国絵の背景 ───── */
.scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .moon{transform-origin:center;animation:moonpulse 5.5s ease-in-out infinite}
@keyframes moonpulse{0%,100%{opacity:.5}50%{opacity:.72}}
.scene .clouds{animation:drift 70s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-160px)}}
.scene .clouds2{animation:drift2 110s linear infinite}
@keyframes drift2{from{transform:translateX(0)}to{transform:translateX(-220px)}}
.scene .army{transform-origin:50% 100%;animation:march 6s ease-in-out infinite}
@keyframes march{0%,100%{transform:rotate(-.5deg)}50%{transform:rotate(.5deg)}}
/* 読みやすさ用の暗幕 */
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,
    rgba(8,6,5,.22) 0%, rgba(8,6,5,.45) 30%, rgba(8,6,5,.70) 60%, rgba(8,6,5,.80) 100%)}

/* 舞い散る桜 */
.sakura{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.sakura i{position:absolute;top:-16px;width:13px;height:13px;opacity:0;
  background:radial-gradient(circle at 50% 15%,#ffe1ec 0%,#f7aecb 55%,#e77ea8 100%);
  border-radius:13px 2px 13px 2px;box-shadow:0 0 6px rgba(247,168,200,.4);
  animation:fall linear infinite}
@keyframes fall{
  0%{opacity:0;transform:translateY(0) translateX(0) rotate(0)}
  12%{opacity:.9}
  80%{opacity:.75}
  100%{opacity:0;transform:translateY(104vh) translateX(48px) rotate(460deg)}}

/* 立ち上る火の粉 */
.embers{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.embers i{position:absolute;bottom:-12px;width:4px;height:4px;border-radius:50%;
  background:radial-gradient(circle,#ffcf6e 0%,var(--ember) 55%,rgba(255,80,0,0) 72%);
  opacity:0;animation:rise linear infinite}
@keyframes rise{
  0%{transform:translateY(0) scale(1);opacity:0}
  12%{opacity:.9}
  70%{opacity:.65}
  100%{transform:translateY(-104vh) scale(.4);opacity:0}}
.maku{height:16px;width:100%;opacity:.95;
  background:repeating-linear-gradient(90deg,
    var(--shu) 0 44px, #0d0a08 44px 52px, var(--gold-dk) 52px 60px, #0d0a08 60px 68px)}
.hero-in{position:relative;padding:22px 20px;text-align:center}
.wrap{position:relative;z-index:3;max-width:720px;margin:0 auto;padding:18px 15px 80px}
.brandbar{display:flex;justify-content:center;margin:6px 0 12px}
.brandbar img{height:28px;width:auto;opacity:.9}
a.back{display:inline-block;margin-bottom:12px;color:var(--muted);text-decoration:none;
  font-size:13px;font-weight:600;letter-spacing:.04em}
a.back:hover{color:var(--gold-lt)}
a.back::before{content:"← ";color:var(--gold-dk)}

/* ヒーロー */
header.hero{position:relative;overflow:hidden;border-radius:10px;margin-bottom:16px;
  border:2px solid var(--gold-dk);text-align:center;padding:0;
  background:linear-gradient(180deg,#1c1411 0%, #0c0908 100%);
  box-shadow:0 16px 38px rgba(0,0,0,.55), inset 0 0 0 3px rgba(0,0,0,.5), inset 0 0 0 4px rgba(212,175,55,.3)}
.chip{display:inline-block;background:linear-gradient(180deg,var(--shu-lt),var(--shu));
  color:#fff;border-radius:3px;padding:3px 13px;font-size:11px;font-weight:700;
  letter-spacing:.18em;margin-bottom:10px;box-shadow:0 2px 8px rgba(179,32,42,.5)}
.logo-img{display:block;margin:4px auto 2px;width:min(104%,600px);height:auto;
  animation:logopulse 3.8s ease-in-out infinite}
@keyframes logopulse{
  0%,100%{filter:drop-shadow(0 6px 14px rgba(0,0,0,.55)) drop-shadow(0 0 12px rgba(255,175,55,.16))}
  50%{filter:drop-shadow(0 6px 14px rgba(0,0,0,.55)) drop-shadow(0 0 30px rgba(255,195,80,.45))}}
h1.title{margin:2px 0 6px;font-family:'Shippori Mincho B1',serif;font-weight:800;
  font-size:clamp(34px,10vw,52px);letter-spacing:.14em;line-height:1.05;color:var(--gold-lt);
  text-shadow:0 2px 0 #000, 0 0 22px rgba(255,150,40,.4)}
h1.title .sword{color:var(--shu-lt)}
.subttl{font-family:'Shippori Mincho B1',serif;font-size:14px;font-weight:700;
  letter-spacing:.16em;color:var(--ink);margin:2px 0}
.meta{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:10px;letter-spacing:.03em}
.updated{font-size:11.5px;color:var(--muted);text-align:right;margin:-2px 2px 16px;letter-spacing:.03em}

/* 集計 */
.summary{display:flex;gap:10px;margin-bottom:16px}
.summary .box{flex:1;background:linear-gradient(180deg,#17120e,#120e0b);border:1px solid var(--line);
  border-radius:8px;padding:12px 10px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.summary .box b{display:block;font-family:'Shippori Mincho B1',serif;font-size:22px;color:var(--gold-lt);
  font-variant-numeric:tabular-nums}
.summary .box span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em}

.sec-head{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:16px;letter-spacing:.24em;
  color:var(--gold);text-align:center;margin:22px 0 14px;position:relative}
.sec-head::before,.sec-head::after{content:"";position:absolute;top:50%;width:24%;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-dk))}
.sec-head::before{left:0}.sec-head::after{right:0;background:linear-gradient(270deg,transparent,var(--gold-dk))}

/* 合戦ログ */
ul.log{list-style:none;margin:0;padding:0}
ul.log li{position:relative;background:linear-gradient(180deg,#171310,#100c0a);border-radius:8px;
  padding:14px 16px 14px 18px;margin-bottom:11px;border:1px solid var(--line);
  box-shadow:0 6px 16px rgba(0,0,0,.42)}
ul.log li::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:8px 0 0 8px;
  background:linear-gradient(180deg,var(--shu),var(--gold-dk))}
.log .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.log .no{font-family:'Jost',sans-serif;font-weight:700;color:var(--muted);font-size:13px}
.log .date{margin-left:auto;font-size:11.5px;color:var(--muted)}
.badge{display:inline-block;font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:11px;
  letter-spacing:.06em;padding:3px 9px;border-radius:3px;color:#fff}
.badge.b1{background:linear-gradient(180deg,#3a6ea5,#20364f)}      /* 防衛成功 */
.badge.b2{background:linear-gradient(180deg,var(--shu-lt),var(--shu))} /* 下剋上成功 */
.badge.b3{background:linear-gradient(180deg,#f0a53a,#b3202a)}       /* 大下剋上成功 */
.log .vs{margin-top:9px;font-family:'Shippori Mincho B1',serif;font-size:16px;font-weight:800;color:var(--ink)}
.log .vs .win{color:var(--gold-lt)}
.log .vs .lose{color:var(--muted)}
.log .vs .x{color:var(--shu-lt);margin:0 8px;font-size:13px}
.log .plunder{margin-top:5px;font-size:13px;font-weight:700;color:var(--ember);
  font-family:'Shippori Mincho B1',serif}
.log .result{margin-top:5px;font-size:12px;color:var(--muted)}

/* 空状態 */
.empty{background:linear-gradient(180deg,#17120e,#120e0b);border:1px dashed rgba(212,175,55,.4);
  border-radius:10px;padding:34px 20px;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.empty .em{font-size:40px}
.empty h3{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:18px;letter-spacing:.1em;
  color:var(--gold-lt);margin:10px 0 6px}
.empty p{font-size:13px;color:var(--muted);margin:0;line-height:1.9}

.linkbox{margin:20px 0 4px}
.linkbox a{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(180deg,#17120e,#120e0b);border:1px solid var(--line);border-radius:7px;
  padding:18px 20px;margin-bottom:12px;text-decoration:none;color:var(--ink);font-family:'Shippori Mincho B1',serif;
  font-weight:700;font-size:14px;letter-spacing:.06em;box-shadow:0 6px 16px rgba(0,0,0,.4);
  transition:transform .15s ease,box-shadow .15s ease}
.linkbox a:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,.5)}
.linkbox a::after{content:"›";color:var(--gold-lt);font-size:18px;line-height:1}
footer{text-align:center;font-size:11.5px;color:var(--muted);margin-top:44px;
  font-family:'Shippori Mincho B1',serif;letter-spacing:.14em}
</style></head><body>
